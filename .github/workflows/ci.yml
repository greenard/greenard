name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: greenard
          POSTGRES_PASSWORD: greenard
          POSTGRES_DB: greenard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenard" --health-interval 5s --health-retries 20
    defaults:
      run:
        shell: bash -el {0}
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: backend/environment.yml
          cache-environment: true
      - run: pip install -e ".[dev]"
      - run: ruff check app tests && ruff format --check app tests
      - name: Migrations
        run: alembic upgrade head && alembic check
        env:
          GREENARD_DATABASE_URL: postgresql+psycopg://greenard:greenard@localhost:5432/greenard_test
      - name: Tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://greenard:greenard@localhost:5432/greenard_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

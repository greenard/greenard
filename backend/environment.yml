# Environnement d'exécution (image Docker et développement) : bibliothèques natives cohérentes
# (ecCodes, GDAL, PROJ, HDF5/netCDF) fournies par conda-forge.
name: greenard
channels:
  - conda-forge
dependencies:
  - python=3.12
  - eccodes>=2.37
  - python-eccodes
  - cfgrib
  - gdal>=3.8
  - rasterio>=1.3
  - proj>=9.3
  - pyproj>=3.6
  - netcdf4
  - xarray
  - numpy
  - scipy
  - shapely>=2
  - psycopg>=3.1
  - tzdata>=2026d        # fuseaux IANA à jour (Maroc : passage à UTC+0 le 20/09/2026)
  - openpyxl
  - pyarrow
  - pip

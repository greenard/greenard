[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenard"
version = "0.1.0"
description = "Prévision météorologique et prévision de production éolienne"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "numpy>=1.26",
  "scipy>=1.13",
  "pyproj>=3.6",
  "shapely>=2.0",
  "xarray>=2024.6",
  "netCDF4>=1.7",
  "rasterio>=1.3",
  "eccodes>=2.37",
  "cfgrib>=0.9.14",
  "openpyxl>=3.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
greenard = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: nécessite un accès Internet aux sources de données (désactivé par défaut)",
  "db: nécessite PostgreSQL/PostGIS (TEST_DATABASE_URL)",
  "slow: test long (fichiers de grille réels)",
]
addopts = "-m 'not network and not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# fixtures pytest importées depuis un autre module de test
"tests/test_forecasts_api.py" = ["F811"]
"tests/test_farm_mast_api.py" = ["F811"]
"tests/*" = ["E501"]
